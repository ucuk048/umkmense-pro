networks:
  evo_net:
    name: evo_net
    driver: bridge

volumes:
  n8n_data:
    name: n8n_data
  evolution_instances:
    name: evolution_instances
  postgres_data:
    name: postgres_data
  redis_data:
    name: redis_data

services:
  evo_postgres:
    image: postgres:15-alpine
    container_name: evo_postgres
    restart: unless-stopped
    networks:
      - evo_net
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  evo_redis:
    image: redis:alpine
    container_name: evo_redis
    restart: unless-stopped
    networks:
      - evo_net
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api
    restart: unless-stopped
    networks:
      - evo_net
    depends_on:
      evo_postgres:
        condition: service_healthy
      evo_redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_URL: http://localhost:8080
      DOCKER_ENV: "true"
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-umkmense_secret_key_123}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:evolution@evo_postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_db
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evo_redis:6379/6
      CONFIG_SESSION_PHONE_CLIENT: Evolution API
      CONFIG_SESSION_PHONE_NAME: Chrome
      DEL_INSTANCE: "false"
      CORS_ORIGIN: "*"
      CORS_CREDENTIALS: "true"
      CORS_METHODS: POST,GET,PUT,DELETE
    volumes:
      - evolution_instances:/evolution/instances

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    networks:
      - evo_net
    depends_on:
      - evolution_api
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      NODE_ENV: production
      N8N_RELEASE_TYPE: stable
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_WEBHOOK_URL: http://localhost:5678/
      WEBHOOK_URL: http://localhost:5678/
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-umkmense_secret_key_123}
      GROQ_API_KEY: ${GROQ_API_KEY}
      VIBE_API_KEY: ${VIBE_API_KEY}
      GEMINI_API_KEY_1: ${GEMINI_API_KEY_1}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2}
      GEMINI_API_KEY_3: ${GEMINI_API_KEY_3}
      UMKMENSE_MAX_AUDIO_MB: ${UMKMENSE_MAX_AUDIO_MB:-8}
      UMKMENSE_MAX_IMAGE_MB: ${UMKMENSE_MAX_IMAGE_MB:-10}
      UMKMENSE_MAX_MEDIA_MB: ${UMKMENSE_MAX_MEDIA_MB:-12}
    volumes:
      - n8n_data:/home/node/.n8n
